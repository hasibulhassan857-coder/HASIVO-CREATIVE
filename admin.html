<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — HASIVO CREATIVE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --deep: #0F0C18;
      --surface: #171323;
      --purple: #9B79F5;
      --light: #C8B6FF;
      --soft: #FAF9FD;
      --muted: #777187;
      --danger: #EF4444;
      --success: #10B981;
      --line: rgba(23, 19, 35, 0.09);
      --shadow: 0 18px 50px rgba(23, 19, 35, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--soft); color: var(--deep); font-family: "DM Sans", sans-serif; min-height: 100vh; }
    h1, h2, h3 { font-family: "Space Grotesk", sans-serif; }

    .topbar {
      background: var(--deep); color: white; padding: 18px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08); position: sticky; top: 0; z-index: 40;
    }
    .container { width: min(1180px, calc(100% - 40px)); margin: auto; }
    .topbar-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand-title { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 18px; letter-spacing: -0.02em; }
    .badge { background: rgba(155, 121, 245, 0.2); color: var(--light); font-size: 11px; padding: 4px 10px; border-radius: 999px; letter-spacing: 0.1em; }
    .btn-sm {
      background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.15);
      padding: 9px 16px; border-radius: 999px; font-size: 12px; font-weight: 700; text-decoration: none; transition: 0.2s;
    }
    .btn-sm:hover { background: var(--purple); border-color: var(--purple); }

    .dashboard { display: grid; grid-template-columns: 380px 1fr; gap: 32px; padding: 40px 0 80px; align-items: start; }

    .panel { background: white; border: 1px solid var(--line); border-radius: 22px; padding: 28px; box-shadow: var(--shadow); }
    .panel h2 { font-size: 22px; margin-bottom: 6px; }
    .panel-sub { color: var(--muted); font-size: 13px; margin-bottom: 22px; }

    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 7px; text-transform: uppercase; }
    .field input, .field select {
      width: 100%; border: 1px solid #e4dfee; background: #fbfaff; border-radius: 12px;
      padding: 13px 14px; font: inherit; font-size: 14px; color: var(--deep); outline: none; transition: 0.2s;
    }
    .field input:focus, .field select:focus { border-color: var(--purple); background: white; box-shadow: 0 0 0 4px rgba(155, 121, 245, 0.14); }

    .img-tabs { display: flex; gap: 8px; margin-bottom: 10px; }
    .tab-btn {
      flex: 1; padding: 8px; border: 1px solid var(--line); background: var(--soft); border-radius: 10px;
      font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s;
    }
    .tab-btn.active { background: var(--deep); color: white; border-color: var(--deep); }

    .preview-box {
      width: 100%; height: 160px; border: 2px dashed #dcd6eb; border-radius: 14px;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      margin-bottom: 18px; background: #fbfaff; color: var(--muted); font-size: 12px;
    }
    .preview-box img { width: 100%; height: 100%; object-fit: cover; }

    .btn-primary {
      width: 100%; border: 0; border-radius: 999px; padding: 14px;
      background: linear-gradient(135deg, var(--purple), #7E57EB); color: white;
      font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.25s;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(155, 121, 245, 0.35); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .list-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
    .filter-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .pill {
      border: 1px solid var(--line); background: white; padding: 7px 14px; border-radius: 999px;
      font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.2s;
    }
    .pill.active, .pill:hover { background: var(--deep); color: white; border-color: var(--deep); }

    .admin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
    .item-card {
      background: white; border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
      box-shadow: 0 6px 20px rgba(23, 19, 35, 0.04); transition: 0.25s; display: flex; flex-direction: column;
    }
    .item-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
    .item-thumb { width: 100%; height: 160px; background: #1e1730; overflow: hidden; position: relative; }
    .item-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .item-body { padding: 15px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; }
    .item-cat { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--purple); }
    .item-title { font-size: 16px; margin-top: 3px; color: var(--deep); }
    .btn-del {
      width: 100%; padding: 9px; border-radius: 10px; border: 1px solid rgba(239, 68, 68, 0.25);
      background: rgba(239, 68, 68, 0.06); color: var(--danger); font-size: 12px; font-weight: 700;
      cursor: pointer; transition: 0.2s;
    }
    .btn-del:hover { background: var(--danger); color: white; }

    .toast {
      position: fixed; bottom: 24px; right: 24px; background: var(--deep); color: white;
      padding: 14px 22px; border-radius: 14px; font-size: 13px; font-weight: 600;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25); transform: translateY(100px); opacity: 0;
      transition: all 0.3s ease; z-index: 100; border-left: 4px solid var(--purple);
    }
    .toast.show { transform: translateY(0); opacity: 1; }

    .auth-screen {
      position: fixed; inset: 0; background: var(--deep); z-index: 200;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .auth-box { background: white; padding: 36px; border-radius: 24px; max-width: 380px; width: 100%; text-align: center; }
    .auth-box h2 { margin-bottom: 8px; }
    .auth-box p { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

    @media(max-width: 860px) { .dashboard { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <div class="auth-screen" id="authScreen">
    <div class="auth-box">
      <h2>Admin Access</h2>
      <p>Enter passcode to manage HASIVO CREATIVE portfolio</p>
      <div class="field">
        <input type="password" id="passInput" placeholder="Enter passcode (Default: hasivo2026)" onkeyup="if(event.key==='Enter') checkPass()">
      </div>
      <button class="btn-primary" onclick="checkPass()">UNLOCK PANEL ↗</button>
    </div>
  </div>

  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand-title">
        <span>HASIVO CREATIVE</span>
        <span class="badge">ADMIN PANEL</span>
      </div>
      <a href="index.html" class="btn-sm">VIEW LIVE SITE ↗</a>
    </div>
  </header>

  <main class="container dashboard">
    <section class="panel">
      <h2>Add New Work</h2>
      <p class="panel-sub">Publish design directly to your folder portfolio.</p>

      <form id="addForm">
        <div class="field">
          <label for="projectName">Project Title</label>
          <input type="text" id="projectName" placeholder="e.g. Valorant Tournament Poster" required>
        </div>

        <div class="field">
          <label for="category">Category Folder</label>
          <select id="category" required>
            <option value="" disabled selected>Select category folder</option>
            <option value="esports design">Esports Design</option>
            <option value="esports thumbnail">Esports Thumbnail</option>
            <option value="logo design">Logo Design</option>
            <option value="thumbnail design">Thumbnail Design</option>
            <option value="video editing">Video Editing</option>
          </select>
        </div>

        <div class="field">
          <label>Project Image</label>
          <div class="img-tabs">
            <button type="button" class="tab-btn active" id="tabUrl" onclick="switchMode('url')">Image URL</button>
            <button type="button" class="tab-btn" id="tabFile" onclick="switchMode('file')">Upload File</button>
          </div>

          <div id="urlInputBox">
            <input type="url" id="imageUrl" placeholder="https://i.ibb.co/..." oninput="previewFromUrl(this.value)">
          </div>

          <div id="fileInputBox" style="display:none;">
            <input type="file" id="imageFile" accept="image/*" onchange="previewFromFile(this)">
          </div>
        </div>

        <div class="preview-box" id="previewBox">
          <span>Image Preview</span>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">PUBLISH PROJECT ↗</button>
      </form>
    </section>

    <section>
      <div class="list-header">
        <div>
          <h2>Manage Projects (<span id="projectCount">0</span>)</h2>
          <p style="color:var(--muted); font-size:13px;">Filter folder or delete existing work.</p>
        </div>
      </div>

      <div class="filter-pills" id="adminFilters">
        <button class="pill active" data-cat="all">ALL</button>
        <button class="pill" data-cat="esports design">ESPORTS DESIGN</button>
        <button class="pill" data-cat="esports thumbnail">ESPORTS THUMBNAIL</button>
        <button class="pill" data-cat="logo design">LOGO DESIGN</button>
        <button class="pill" data-cat="thumbnail design">THUMBNAIL DESIGN</button>
        <button class="pill" data-cat="video editing">VIDEO EDITING</button>
      </div>

      <div class="admin-grid" id="adminGrid">
        <p style="color:var(--muted);">Loading projects...</p>
      </div>
    </section>
  </main>

  <div class="toast" id="toast">Action completed</div>

  <script>
    const ADMIN_PASS = 'hasivo2026';
    if (sessionStorage.getItem('hc_admin') === 'true') {
      document.getElementById('authScreen').style.display = 'none';
    }
    function checkPass() {
      const val = document.getElementById('passInput').value;
      if (val === ADMIN_PASS) {
        sessionStorage.setItem('hc_admin', 'true');
        document.getElementById('authScreen').style.display = 'none';
      } else {
        showToast('Incorrect passcode!', true);
      }
    }

    const SUPABASE_URL = 'https://uxbxmrvdnxuzzgxdfgpe.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_o2uNrxVEoqwU0c4Jp7ucQg_UGjli5OW';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let uploadMode = 'url';
    let allProjects = [];

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.borderLeftColor = isError ? '#EF4444' : '#9B79F5';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3200);
    }

    function switchMode(mode) {
      uploadMode = mode;
      document.getElementById('tabUrl').classList.toggle('active', mode === 'url');
      document.getElementById('tabFile').classList.toggle('active', mode === 'file');
      document.getElementById('urlInputBox').style.display = mode === 'url' ? 'block' : 'none';
      document.getElementById('fileInputBox').style.display = mode === 'file' ? 'block' : 'none';
      document.getElementById('previewBox').innerHTML = '<span>Image Preview</span>';
    }

    function previewFromUrl(url) {
      const box = document.getElementById('previewBox');
      if (url.trim()) {
        box.innerHTML = `<img src="${url}" onerror="this.parentElement.innerHTML='<span>Invalid Image URL</span>'">`;
      } else {
        box.innerHTML = '<span>Image Preview</span>';
      }
    }

    function previewFromFile(input) {
      const box = document.getElementById('previewBox');
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => box.innerHTML = `<img src="${e.target.result}">`;
        reader.readAsDataURL(input.files[0]);
      }
    }

    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const projectName = document.getElementById('projectName').value.trim();
      const category = document.getElementById('category').value;
      let finalImageUrl = '';

      btn.disabled = true;
      btn.textContent = 'PUBLISHING...';

      try {
        if (uploadMode === 'url') {
          finalImageUrl = document.getElementById('imageUrl').value.trim();
          if (!finalImageUrl) throw new Error('Please enter an image URL.');
        } else {
          const fileInput = document.getElementById('imageFile');
          if (!fileInput.files || !fileInput.files[0]) throw new Error('Please select an image file.');
          
          const file = fileInput.files[0];
          const fileExt = file.name.split('.').pop();
          const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 8)}.${fileExt}`;

          const { error: uploadError } = await supabaseClient.storage
            .from('projects')
            .upload(fileName, file);

          if (uploadError) throw new Error('Storage upload failed. Make sure "projects" bucket exists & is public, or use Image URL.');

          const { data: urlData } = supabaseClient.storage.from('projects').getPublicUrl(fileName);
          finalImageUrl = urlData.publicUrl;
        }

        const { error: insertError } = await supabaseClient
          .from('projects')
          .insert([{
            project_name: projectName,
            category: category,
            image_url: finalImageUrl
          }]);

        if (insertError) throw insertError;

        showToast('Project published successfully!');
        document.getElementById('addForm').reset();
        document.getElementById('previewBox').innerHTML = '<span>Image Preview</span>';
        fetchProjects();

      } catch (err) {
        console.error(err);
        showToast(err.message || 'Failed to add project', true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'PUBLISH PROJECT ↗';
      }
    });

    async function fetchProjects() {
      const grid = document.getElementById('adminGrid');
      try {
        const { data, error } = await supabaseClient
          .from('projects')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;
        allProjects = data || [];
        renderProjects();
      } catch (err) {
        grid.innerHTML = `<p style="color:var(--danger);">Error loading projects: ${err.message}</p>`;
      }
    }

    function renderProjects() {
      const grid = document.getElementById('adminGrid');
      const activePill = document.querySelector('.pill.active');
      const selectedCat = activePill ? activePill.dataset.cat.toLowerCase().trim() : 'all';

      const filtered = selectedCat === 'all'
        ? allProjects
        : allProjects.filter(p => (p.category || '').toLowerCase().trim() === selectedCat);

      document.getElementById('projectCount').textContent = filtered.length;

      if (filtered.length === 0) {
        grid.innerHTML = '<p style="color:var(--muted);">No projects in this folder.</p>';
        return;
      }

      grid.innerHTML = '';
      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
          <div class="item-thumb">
            <img src="${item.image_url || ''}" alt="${item.project_name}" onerror="this.src='https://via.placeholder.com/400x250/171323/C8B6FF?text=No+Image'">
          </div>
          <div class="item-body">
            <div>
              <div class="item-cat">${item.category || 'Uncategorized'}</div>
              <h3 class="item-title">${item.project_name || 'Untitled'}</h3>
            </div>
            <button class="btn-del" onclick="deleteProject('${item.id}')">DELETE PROJECT</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function deleteProject(id) {
      if (!confirm('Are you sure you want to delete this project?')) return;

      try {
        const { error } = await supabaseClient
          .from('projects')
          .delete()
          .eq('id', id);

        if (error) throw error;

        showToast('Project deleted!');
        fetchProjects();
      } catch (err) {
        console.error(err);
        showToast('Delete failed: ' + err.message, true);
      }
    }

    document.getElementById('adminFilters').addEventListener('click', (e) => {
      if (e.target.classList.contains('pill')) {
        document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
        e.target.classList.add('active');
        renderProjects();
      }
    });

    fetchProjects();
  </script>
</body>
</html>
