 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HASIVO CREATIVE - Admin Panel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0b0914; color: #f8fafc; }
        h1, h2 { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body class="min-h-screen py-10 px-4">

    <div class="max-w-2xl mx-auto space-y-8">
        <!-- UPLOAD FORM CARD -->
        <div class="bg-slate-900/90 border border-slate-800 p-8 rounded-2xl shadow-2xl">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h1 class="text-2xl font-bold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">HASIVO CREATIVE</h1>
                    <p class="text-slate-400 text-xs mt-1">Admin Vault — Upload & Manage Portfolio</p>
                </div>
                <a href="index.html" target="_blank" class="text-xs bg-slate-800 hover:bg-purple-600 text-white px-4 py-2 rounded-full font-semibold transition">
                    VIEW LIVE SITE ↗
                </a>
            </div>

            <form id="projectForm" class="space-y-4">
                <!-- Project Name -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">Project Title</label>
                    <input type="text" id="projectName" required placeholder="e.g., Esports Tournament Poster" 
                        class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-purple-500">
                </div>

                <!-- Category (Exact 5 Categories matching index.html) -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">Category Folder</label>
                    <select id="category" required 
                        class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-purple-500">
                        <option value="" disabled selected>Select a category folder</option>
                        <option value="ESPORTS DESIGN">ESPORTS DESIGN</option>
                        <option value="ESPORTS THUMBNAIL">ESPORTS THUMBNAIL</option>
                        <option value="LOGO DESIGN">LOGO DESIGN</option>
                        <option value="THUMBNAIL DESIGN">THUMBNAIL DESIGN</option>
                        <option value="VIDEO EDITING">VIDEO EDITING</option>
                    </select>
                </div>

                <!-- Description -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">Description</label>
                    <textarea id="description" rows="2" placeholder="Short description about the project..." 
                        class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-purple-500"></textarea>
                </div>

                <!-- Image File Upload + Preview -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">Upload Project Image</label>
                    <input type="file" id="imageFile" accept="image/*" required 
                        class="w-full text-sm text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-700 cursor-pointer">
                    
                    <div id="previewBox" class="hidden mt-3 rounded-xl overflow-hidden border border-slate-700 bg-black/40 p-2">
                        <img id="imagePreview" src="" alt="Preview" class="max-h-48 mx-auto rounded-lg object-contain">
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" 
                    class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white font-semibold py-3.5 rounded-xl shadow-lg hover:opacity-90 transition duration-200 cursor-pointer">
                    Publish Project 🚀
                </button>
            </form>

            <p id="statusMsg" class="text-center text-sm mt-4 hidden font-medium"></p>
        </div>

        <!-- EXISTING PROJECTS MANAGER -->
        <div class="bg-slate-900/90 border border-slate-800 p-6 rounded-2xl shadow-xl">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-bold text-white">Published Projects (<span id="totalCount">0</span>)</h2>
                <button onclick="fetchAdminProjects()" class="text-xs text-purple-400 hover:underline">Refresh 🔄</button>
            </div>
            <div id="adminProjectList" class="space-y-3 max-h-96 overflow-y-auto pr-1">
                <p class="text-slate-500 text-sm text-center py-4">Loading projects...</p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://uxbxmrvdnxuzzgxdfgpe.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_o2uNrxVEoqwU0c4Jp7ucQg_UGjli5OW';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('projectForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMsg');
        const imageFileInput = document.getElementById('imageFile');
        const previewBox = document.getElementById('previewBox');
        const imagePreview = document.getElementById('imagePreview');

        // Live Image Preview
        imageFileInput.addEventListener('change', () => {
            const file = imageFileInput.files[0];
            if (file) {
                imagePreview.src = URL.createObjectURL(file);
                previewBox.classList.remove('hidden');
            } else {
                previewBox.classList.add('hidden');
            }
        });

        // Form Submit
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Uploading... ⏳';
            statusMsg.classList.remove('hidden', 'text-red-400', 'text-green-400');
            statusMsg.textContent = 'Uploading image and saving project...';

            try {
                const projectName = document.getElementById('projectName').value.trim();
                const category = document.getElementById('category').value.trim().toUpperCase();
                const description = document.getElementById('description').value.trim();
                const fileInput = imageFileInput.files[0];

                if (!fileInput) throw new Error('Please select an image file!');

                const fileExt = fileInput.name.split('.').pop();
                const randomId = Math.random().toString(36).substring(2, 7);
                const fileName = `${Date.now()}_${randomId}.${fileExt}`;
                const filePath = `${fileName}`;

                const { error: uploadError } = await supabaseClient.storage
                    .from('project image')
                    .upload(filePath, fileInput);

                if (uploadError) throw uploadError;

                const { data: urlData } = supabaseClient.storage
                    .from('project image')
                    .getPublicUrl(filePath);

                const imageUrl = urlData.publicUrl;

                const { error: insertError } = await supabaseClient
                    .from('projects')
                    .insert([
                        { 
                            project_name: projectName, 
                            category: category, 
                            description: description, 
                            image_url: imageUrl 
                        }
                    ]);

                if (insertError) throw insertError;

                statusMsg.textContent = 'Project published successfully! 🎉';
                statusMsg.classList.add('text-green-400');
                form.reset();
                previewBox.classList.add('hidden');
                fetchAdminProjects();

            } catch (error) {
                console.error(error);
                statusMsg.textContent = 'Error: ' + error.message;
                statusMsg.classList.add('text-red-400');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Publish Project 🚀';
            }
        });

        // Fetch & Manage Existing Projects
        async function fetchAdminProjects() {
            const listEl = document.getElementById('adminProjectList');
            try {
                const { data, error } = await supabaseClient
                    .from('projects')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                document.getElementById('totalCount').textContent = data.length;

                if (!data || data.length === 0) {
                    listEl.innerHTML = '<p class="text-slate-500 text-sm text-center py-4">No projects uploaded yet.</p>';
                    return;
                }

                listEl.innerHTML = data.map(p => `
                    <div class="flex items-center justify-between bg-slate-800/60 border border-slate-700/70 p-3 rounded-xl gap-3">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <img src="${p.image_url}" alt="" class="w-12 h-12 rounded-lg object-cover bg-slate-900 shrink-0">
                            <div class="truncate">
                                <h4 class="text-sm font-semibold text-white truncate">${p.project_name}</h4>
                                <span class="text-[11px] text-purple-400 font-medium">${p.category}</span>
                            </div>
                        </div>
                        <button onclick="deleteProject(${p.id})" class="bg-red-500/15 hover:bg-red-600 text-red-400 hover:text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition shrink-0 cursor-pointer">
                            Delete
                        </button>
                    </div>
                `).join('');
            } catch (err) {
                listEl.innerHTML = `<p class="text-red-400 text-xs">Failed to load: ${err.message}</p>`;
            }
        }

        async function deleteProject(id) {
            if (!confirm('Are you sure you want to delete this project?')) return;
            try {
                const { error } = await supabaseClient
                    .from('projects')
                    .delete()
                    .eq('id', id);

                if (error) throw error;
                fetchAdminProjects();
            } catch (err) {
                alert('Delete failed: ' + err.message);
            }
        }

        fetchAdminProjects();
    </script>
</body>
</html>
