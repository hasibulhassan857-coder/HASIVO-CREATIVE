<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HASIVO CREATIVE - Admin Panel</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-lg">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">HASIVO CREATIVE</h1>
            <p class="text-slate-400 text-sm mt-1">Admin Panel - Add New Project</p>
        </div>

        <form id="projectForm" class="space-y-4">
            <!-- Project Name -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Project Title</label>
                <input type="text" id="projectName" required placeholder="e.g., Esports Banner Design" 
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-purple-500">
            </div>

            <!-- Category (Exact 5 Categories) -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Category</label>
                <select id="category" required 
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-purple-500">
                    <option value="" disabled selected>Select a category</option>
                    <option value="ESPORTS DESIGN">ESPORTS DESIGN</option>
                    <option value="ESPORTS THUMBNAIL">ESPORTS THUMBNAIL</option>
                    <option value="LOGO DESIGN">LOGO DESIGN</option>
                    <option value="THUMBNAIL DESIGN">THUMBNAIL DESIGN</option>
                    <option value="VIDEO EDITING">VIDEO EDITING</option>
                </select>
            </div>

            <!-- Description -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Description</label>
                <textarea id="description" rows="3" placeholder="Short description about the project..." 
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-purple-500"></textarea>
            </div>

            <!-- Image File Upload -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Upload Project Image</label>
                <input type="file" id="imageFile" accept="image/*" required 
                    class="w-full text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-700 cursor-pointer">
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" 
                class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white font-medium py-3 rounded-lg shadow-lg hover:opacity-90 transition duration-200">
                Publish Project 🚀
            </button>
        </form>

        <p id="statusMsg" class="text-center text-sm mt-4 hidden"></p>
    </div>

    <script>
        const SUPABASE_URL = 'https://uxbxmrvdnxuzzgxdfgpe.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_o2uNrxVEoqwU0c4Jp7ucQg_UGjli5OW';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('projectForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Uploading... ⏳';
            statusMsg.classList.remove('hidden', 'text-red-400', 'text-green-400');
            statusMsg.textContent = 'Uploading image and saving project...';

            try {
                const projectName = document.getElementById('projectName').value;
                const category = document.getElementById('category').value;
                const description = document.getElementById('description').value;
                const fileInput = document.getElementById('imageFile').files[0];

                if (!fileInput) throw new Error('Please select an image file!');

                const fileExt = fileInput.name.split('.').pop();
                const fileName = `${Date.now()}.${fileExt}`;
                const filePath = `${fileName}`;

                const { data: uploadData, error: uploadError } = await supabaseClient.storage
                    .from('project image')
                    .upload(filePath, fileInput);

                if (uploadError) throw uploadError;

                const { data: urlData } = supabaseClient.storage
                    .from('project image')
                    .getPublicUrl(filePath);

                const imageUrl = urlData.publicUrl;

                const { error: insertError } = await supabaseClient
                    .from('projects')
                    .insert([
                        { 
                            project_name: projectName, 
                            category: category, 
                            description: description, 
                            image_url: imageUrl 
                        }
                    ]);

                if (insertError) throw insertError;

                statusMsg.textContent = 'Project published successfully! 🎉';
                statusMsg.classList.add('text-green-400');
                form.reset();

            } catch (error) {
                console.error(error);
                statusMsg.textContent = 'Error: ' + error.message;
                statusMsg.classList.add('text-red-400');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Publish Project 🚀';
            }
        });
    </script>
</body>
</html>
